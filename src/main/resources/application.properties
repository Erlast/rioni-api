spring.profiles.active=dev
spring.application.name=api
spring.datasource.username=rioni_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database=postgresql
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
app.avatars.base-url=http://localhost:8080/profile/avatars/
app.avatars.storage-path=./src/main/resources/static/profile/avatars
app.uploads.base-url=http://localhost:8080/uploads/
app.uploads.storage-path=./uploads

jwt.secret=${JWT_SECRET:somestringthatisatleast32characterslong}
jwt.access-token-expiration=3600
jwt.refresh-token-expiration=604800