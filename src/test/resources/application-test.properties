# Test profile - connects to dedicated test PostgreSQL container
# Start with: docker run -d --name rioni-test-pg \
#   -e POSTGRES_DB=rioni_test -e POSTGRES_USER=rioni_db \
#   -e POSTGRES_PASSWORD=xDspl!pzoxI98^zLPz_02kLk \
#   -p 5433:5432 postgres:16-alpine
# CI/CD: provide PostgreSQL service and set TEST_DB_HOST/TEST_DB_PORT
spring.datasource.url=jdbc:postgresql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:5433}/${TEST_DB_NAME:rioni_test}?currentSchema=${TEST_DB_SCHEMA:public}
spring.datasource.username=${TEST_DB_USERNAME:rioni_db}
spring.datasource.password=${TEST_DB_PASSWORD:xDspl!pzoxI98^zLPz_02kLk}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database=postgresql

# Hibernate creates schema from JPA entities (no V1 migration exists)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=public

# Disable Flyway auto-configuration in tests.
# The FlywayConfig CommandLineRunner will be a no-op (migrate finds no pending migrations).
spring.flyway.enabled=false
spring.flyway.default-schema=public

# Load test seed data AFTER Hibernate schema creation.
# ON CONFLICT DO NOTHING in test-data.sql prevents duplicate key errors on re-runs.
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:test-data.sql
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# Disable file upload for tests
app.avatars.storage-path=./build/test-avatars
app.uploads.storage-path=./build/test-uploads
app.avatars.base-url=http://localhost:8080/profile/avatars/
app.uploads.base-url=http://localhost:8080/uploads/

# JWT secret for tests (must match production length requirements)
jwt.secret=testSecretKeyThatIsAtLeast32CharactersLongForJwt
jwt.access-token-expiration=3600
jwt.refresh-token-expiration=604800

# Disable logging during tests
logging.level.com.rioni.lk=WARN
