services:
  api:
    build: .
    image: rioni-api:latest
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres-16-1-master
      DB_PORT: 5432
      DB_NAME: rioni_db
      DB_SCHEMA: rioni_prod
      DB_USERNAME: rioni_db
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - '8081:8080'
      - '5005:5005'
    restart: unless-stopped
    networks:
      - dev

networks:
  dev:
    external: true