services:
  api:
    build: .
    image: rioni-api:latest
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-rioni_db}
      DB_SCHEMA: ${DB_SCHEMA:-rioni_dev}
      DB_USERNAME: ${DB_USERNAME:-rioni_db}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - '${API_PORT:-8081}:8080'
      - '5005:5005'
    restart: unless-stopped
    networks:
      - dev

networks:
  dev:
    external: true